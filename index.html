<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgroTrader Pro - Agriculture Store POS, Inventory & Ledger</title>
  <meta name="description" content="State-of-the-art Agriculture Store POS, Ledgers, Inventory, Purchases and Amanat Stock ERP">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles/index.css">
</head>
<body class="theme-sapphire">
  <!-- Desktop App Window Chrome Titlebar -->
  <header class="window-titlebar" id="app-window-titlebar">
    <div class="window-titlebar-left">
      <div class="window-app-name">
        <span id="titlebar-leaf-icon"></span>
        <span>AgriSol Pro &bull; Ahmed & Co.</span>
      </div>
      <nav class="window-menu-items" aria-label="Application menu">
        <span class="window-menu-item" id="menu-file">File</span>
        <span class="window-menu-item" id="menu-edit">Edit</span>
        <span class="window-menu-item" id="menu-view">View</span>
        <span class="window-menu-item" id="menu-window">Window</span>
        <span class="window-menu-item" id="menu-help">Help</span>
      </nav>
    </div>
    <div class="window-controls">
      <span class="win-btn win-btn-min" title="Minimize"></span>
      <span class="win-btn win-btn-max" title="Maximize"></span>
      <span class="win-btn win-btn-close" title="Close" id="win-btn-logout"></span>
    </div>
  </header>

  <!-- Main Root Container -->
  <div id="app" class="app-container">
    <!-- Rendered dynamically by main.js -->
  </div>

  <!-- Global Modal Mount Point -->
  <div id="modal-root"></div>

  <!-- Global Toast Notifications -->
  <div id="toast-root" class="toast-container"></div>

  <!-- Hidden Printable Thermal Receipt Container -->
  <div id="printable-receipt-area" style="display: none;"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
